[project]
name = "forgetting-dynamics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.34,<0.5",
    "jaxlib>=0.4.34,<0.5",
    "jax-metal>=0.1.0 ; sys_platform == 'darwin'",
    "flax>=0.7.0",
    "optax>=0.1.7",
    "wandb>=0.16.0",
    "numpy>=1.24.0",
    "tqdm>=4.60.0",
    "tokenizers>=0.15.0",
]

[dependency-groups]
# Plotting and offline analysis.
analysis = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

# Pretrained language model (llm/), installed into a separate environment:
#   uv venv .venv-llm && uv pip install --python .venv-llm --group llm
llm = [
    "torch>=2.4",
    "transformers>=4.48",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
